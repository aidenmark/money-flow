name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No install step: the project has no dependencies, by design.
      # `npm test` first checks index.html is in step with src/money.js,
      # then runs the suite.
      - run: npm test
